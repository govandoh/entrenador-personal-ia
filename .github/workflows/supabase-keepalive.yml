name: Supabase keepalive

# El plan Free pausa el proyecto tras una semana sin actividad (DEC-029, DEC-035).
# Una consulta semanal a la API REST lo evita. Usa solo la clave anon (pública por
# diseño; los datos los protege RLS), nunca la service-role (regla dura 3).

on:
  schedule:
    # Dos veces por semana: una sola quedaría en el límite de 7 días de inactividad si
    # GitHub retrasa o salta una ejecución.
    - cron: '0 12 * * 1,4' # lunes y jueves, 12:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la API REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_ANON_KEY" || { echo "Faltan los secretos SUPABASE_URL y SUPABASE_ANON_KEY"; exit 1; }
          # anon no lee tablas (RLS); la función keepalive() de 0400 es su única puerta.
          curl --fail --silent --show-error --max-time 30 -X POST \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -d '{}' \
            "$SUPABASE_URL/rest/v1/rpc/keepalive" > /dev/null
          echo "Proyecto activo."
